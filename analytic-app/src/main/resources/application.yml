spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/metricdb
    username: metric
    password: metric
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
analytic:
  jobs:
    max-concurrent: 20
server:
  port: 8083
gateway:
  host: http://localhost:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      # Включает специальные эндпоинты /actuator/health/liveness и /actuator/health/readiness
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  server:
    port: 8883