spring:
  mongodb:
    uri: mongodb://root:example@localhost:27017/production_calendar_db?authSource=admin
mongock:
  enabled: true
  migration-scan-package: "ru.otus.vinakov.calendar.migration"
grpc:
  active: true
  port: 8981
server:
  port: 8082
calendar:
  limits:
    max-year-range: 5
    max-duration-range: 157680000