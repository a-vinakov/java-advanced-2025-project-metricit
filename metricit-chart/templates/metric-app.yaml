apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-metric-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metric-app
  template:
    metadata:
      labels:
        app: metric-app
    spec:
      containers:
        - name: metric-app
          image: {{ .Values.metricApp.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.metricApp.serverPort }}
            - containerPort: {{ .Values.metricApp.managementPort }}
              name: management
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.db }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgres.user | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Release.Name }}-kafka:{{ .Values.kafka.port }}"
            - name: GRPC_CALENDAR_HOST
              value: "{{ .Release.Name }}-calendar-app"
            - name: GRPC_CALENDAR_PORT
              value: {{ .Values.metricApp.grpcCalendarPort | quote }}
            - name: SERVER_PORT
              value: {{ .Values.metricApp.serverPort | quote }}
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL
              value: "false"
            - name: LOGGING_LEVEL_ORG_HIBERNATE_SQL
              value: "WARN"
            - name: LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER
              value: "WARN"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.metricApp.managementPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.metricApp.managementPort }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-metric-app
spec:
  ports:
    - name: http
      port: {{ .Values.metricApp.serverPort }}
      targetPort: {{ .Values.metricApp.serverPort }}
    - name: management
      port: {{ .Values.metricApp.managementPort }}
      targetPort: {{ .Values.metricApp.managementPort }}
    {{- if .Values.metricApp.grpcCalendarPort }}
    - name: grpc
      port: {{ .Values.metricApp.grpcCalendarPort }}
      targetPort: {{ .Values.metricApp.grpcCalendarPort }}
    {{- end }}
  selector:
    app: metric-app