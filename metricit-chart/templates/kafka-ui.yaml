apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: {{ .Values.kafkaUi.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.kafkaUi.port }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "local"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "{{ .Release.Name }}-kafka:{{ .Values.kafka.port }}"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-ui
spec:
  type: {{ .Values.kafkaUi.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.kafkaUi.service.port }}
      targetPort: {{ .Values.kafkaUi.service.targetPort }}
      {{- if eq .Values.kafkaUi.service.type "NodePort" }}
      nodePort: {{ .Values.kafkaUi.service.nodePort | default 30099 }}
      {{- end }}
  selector:
    app: kafka-ui