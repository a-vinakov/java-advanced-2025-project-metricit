apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-calendar-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar-app
  template:
    metadata:
      labels:
        app: calendar-app
    spec:
      containers:
        - name: calendar-app
          image: {{ .Values.calendarApp.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.calendarApp.serverPort }}
            - containerPort: {{ .Values.calendarApp.grpcPort }}
            - containerPort: {{ .Values.calendarApp.managementPort }}
              name: management
          env:
            - name: SPRING_MONGODB_URI
              value: "mongodb://{{ .Values.mongodb.rootUser }}:{{ .Values.mongodb.rootPassword }}@{{ .Release.Name }}-mongodb:{{ .Values.mongodb.port }}/production_calendar_db?authSource=admin"
            - name: SERVER_PORT
              value: {{ .Values.calendarApp.serverPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.calendarApp.grpcPort | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.calendarApp.managementPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.calendarApp.managementPort }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-calendar-app
spec:
  ports:
    - name: http
      port: {{ .Values.calendarApp.serverPort }}
      targetPort: {{ .Values.calendarApp.serverPort }}
    - name: grpc
      port: {{ .Values.calendarApp.grpcPort }}
      targetPort: {{ .Values.calendarApp.grpcPort }}
    - name: management
      port: {{ .Values.calendarApp.managementPort }}
      targetPort: {{ .Values.calendarApp.managementPort }}
  selector:
    app: calendar-app