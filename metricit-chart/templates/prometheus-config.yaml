apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: 'spring-boot-metrics'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - '{{ .Release.Name }}-calendar-app:{{ .Values.calendarApp.managementPort }}'
              - '{{ .Release.Name }}-metric-app:{{ .Values.metricApp.managementPort }}'
              - '{{ .Release.Name }}-analytic-app:{{ .Values.analyticApp.managementPort }}'
              - '{{ .Release.Name }}-gateway:{{ .Values.gateway.managementPort }}'